<html>
<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#570df8">
  <title>Inkly — Markdown Blog</title>
  <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=">

  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Inkly%20Blog%22%2C%22short_name%22%3A%22Inkly%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22theme_color%22%3A%22%23570df8%22%2C%22background_color%22%3A%22%23ffffff%22%7D">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
</head>

<body class="min-h-screen bg-base-200">
  <header class="navbar border-b border-base-300 bg-base-100 px-4 sm:px-8">
    <div class="flex-1">
      <a href="#" class="text-xl font-black tracking-tight text-primary">
        <i data-lucide="pen-line" class="mr-2 inline-block h-5 w-5"></i>Inkly
      </a>
    </div>
    <div class="flex gap-2">
      <button id="themeBtn" class="btn btn-ghost btn-circle" title="Toggle theme">
        <i data-lucide="sun" class="h-5 w-5"></i>
      </button>
      <button data-action="new" class="btn btn-primary btn-sm">
        <i data-lucide="plus" class="h-4 w-4"></i><span class="hidden sm:inline">New post</span>
      </button>
    </div>
  </header>

  <main id="app" class="mx-auto max-w-6xl p-4 sm:p-8"></main>

  <script>
    const app = document.querySelector("#app");
    let db, editingId = null, currentCover = null;

    // IndexedDB setup
    const ready = new Promise((resolve, reject) => {
      const request = indexedDB.open("inkly-db", 1);
      request.onupgradeneeded = () => request.result.createObjectStore("posts", { keyPath: "id" });
      request.onsuccess = () => { db = request.result; resolve(); };
      request.onerror = () => reject(request.error);
    });

    const store = (mode = "readonly") => db.transaction("posts", mode).objectStore("posts");
    const getAll = () => new Promise(r => {
      const q = store().getAll();
      q.onsuccess = () => r(q.result.sort((a,b) => b.updated - a.updated));
    });
    const getPost = id => new Promise(r => {
      const q = store().get(id);
      q.onsuccess = () => r(q.result);
    });
    const savePost = post => new Promise(r => {
      const q = store("readwrite").put(post);
      q.onsuccess = r;
    });
    const deletePost = id => new Promise(r => {
      const q = store("readwrite").delete(id);
      q.onsuccess = r;
    });

    const esc = value => String(value ?? "").replace(/[&<>"']/g, c =>
      ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[c])
    );

    const imageUrl = blob => blob ? URL.createObjectURL(blob) : "";
    const markdown = text => DOMPurify.sanitize(marked.parse(text || ""));

    function iconRefresh() {
      lucide.createIcons();
    }

    async function renderList() {
      const posts = await getAll();
      app.innerHTML = `
        <section class="mb-8 flex items-end justify-between gap-4">
          <div>
            <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-primary">Your workspace</p>
            <h1 class="text-4xl font-black sm:text-5xl">Stories worth sharing.</h1>
            <p class="mt-3 max-w-xl text-base-content/60">Write, preview, and manage your Markdown posts locally.</p>
          </div>
          <span class="badge badge-lg">${posts.length} post${posts.length === 1 ? "" : "s"}</span>
        </section>
        ${posts.length ? `
          <div class="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            ${posts.map(post => {
              const cover = imageUrl(post.cover);
              return `
                <article class="card overflow-hidden border border-base-300 bg-base-100 shadow-sm transition hover:-translate-y-1 hover:shadow-xl">
                  ${cover ? `<img src="${cover}" class="h-44 w-full object-cover" alt="">` :
                    `<div class="flex h-44 items-center justify-center bg-gradient-to-br from-primary to-secondary text-primary-content"><i data-lucide="feather" class="h-12 w-12"></i></div>`}
                  <div class="card-body">
                    <div class="text-xs text-base-content/50">${new Date(post.updated).toLocaleDateString()}</div>
                    <h2 class="card-title line-clamp-2">${esc(post.title)}</h2>
                    <p class="line-clamp-3 text-sm text-base-content/60">${esc(post.excerpt || post.body.slice(0, 120))}</p>
                    <div class="card-actions mt-3 justify-between">
                      <button class="btn btn-primary btn-sm" data-action="view" data-id="${post.id}">Read post</button>
                      <div class="join">
                        <button class="btn btn-ghost btn-sm join-item" data-action="edit" data-id="${post.id}" title="Edit"><i data-lucide="pencil" class="h-4 w-4"></i></button>
                        <button class="btn btn-ghost btn-sm text-error join-item" data-action="delete" data-id="${post.id}" title="Delete"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                      </div>
                    </div>
                  </div>
                </article>`;
            }).join("")}
          </div>` :
          `<div class="hero rounded-3xl border border-dashed border-base-300 bg-base-100 py-20">
            <div class="hero-content text-center">
              <div>
                <i data-lucide="notebook-pen" class="mx-auto mb-5 h-14 w-14 text-primary"></i>
                <h2 class="text-2xl font-bold">Your blog starts here</h2>
                <p class="mb-6 mt-2 text-base-content/60">Create your first Markdown post.</p>
                <button data-action="new" class="btn btn-primary">Write a post</button>
              </div>
            </div>
          </div>`}`;
      iconRefresh();
    }

    async function renderEditor(id = null) {
      const post = id ? await getPost(id) : null;
      editingId = id;
      currentCover = post?.cover || null;
      app.innerHTML = `
        <div class="mb-6 flex items-center gap-3">
          <button data-action="back" class="btn btn-ghost btn-sm"><i data-lucide="arrow-left" class="h-4 w-4"></i>Back</button>
          <h1 class="text-3xl font-black">${post ? "Edit post" : "New post"}</h1>
        </div>
        <form id="editorForm" class="grid gap-6 lg:grid-cols-2">
          <section class="space-y-4">
            <input name="title" class="input input-bordered w-full text-xl font-bold" placeholder="Post title" required value="${esc(post?.title)}">
            <input name="excerpt" class="input input-bordered w-full" placeholder="Short description" value="${esc(post?.excerpt)}">
            <textarea name="body" id="body" class="textarea textarea-bordered min-h-[420px] w-full font-mono text-sm" placeholder="# Start writing in Markdown...">${esc(post?.body)}</textarea>
            <div class="flex flex-wrap items-center gap-3">
              <label class="btn btn-outline btn-sm">
                <i data-lucide="image-plus" class="h-4 w-4"></i>Cover image
                <input id="cover" type="file" accept="image/*" class="hidden">
              </label>
              <span id="coverName" class="text-sm text-base-content/60">${post?.cover ? "Current cover selected" : "No image selected"}</span>
              <button type="submit" class="btn btn-primary btn-sm ml-auto"><i data-lucide="save" class="h-4 w-4"></i>Save post</button>
            </div>
            <img id="coverPreview" class="${post?.cover ? "" : "hidden"} max-h-48 w-full rounded-xl object-cover" alt="Cover preview">
          </section>
          <section class="rounded-2xl border border-base-300 bg-base-100 p-5">
            <div class="mb-4 flex items-center gap-2 text-sm font-bold uppercase tracking-widest text-primary">
              <i data-lucide="eye" class="h-4 w-4"></i>Live preview
            </div>
            <article id="preview" class="prose max-w-none dark:prose-invert"></article>
          </section>
        </form>`;
      const body = document.querySelector("#body");
      const preview = document.querySelector("#preview");
      const update = () => preview.innerHTML = markdown(body.value);
      body.addEventListener("input", update);
      update();

      if (post?.cover) document.querySelector("#coverPreview").src = imageUrl(post.cover);
      document.querySelector("#cover").addEventListener("change", e => {
        const file = e.target.files[0];
        if (!file) return;
        currentCover = file;
        document.querySelector("#coverName").textContent = file.name;
        const preview = document.querySelector("#coverPreview");
        preview.src = imageUrl(file);
        preview.classList.remove("hidden");
      });
      iconRefresh();
    }

    async function renderPost(id) {
      const post = await getPost(id);
      if (!post) return renderList();
      const cover = imageUrl(post.cover);
      app.innerHTML = `
        <article class="mx-auto max-w-3xl">
          <button data-action="back" class="btn btn-ghost btn-sm mb-6"><i data-lucide="arrow-left" class="h-4 w-4"></i>All posts</button>
          ${cover ? `<img src="${cover}" class="mb-8 max-h-[420px] w-full rounded-3xl object-cover shadow-lg" alt="">` : ""}
          <div class="mb-8">
            <div class="mb-3 text-sm text-base-content/50">${new Date(post.updated).toLocaleDateString()}</div>
            <h1 class="text-4xl font-black leading-tight sm:text-6xl">${esc(post.title)}</h1>
            ${post.excerpt ? `<p class="mt-5 text-xl text-base-content/60">${esc(post.excerpt)}</p>` : ""}
          </div>
          <div class="prose max-w-none rounded-2xl bg-base-100 p-6 shadow-sm dark:prose-invert sm:p-10">${markdown(post.body)}</div>
          <div class="mt-6 text-right"><button data-action="edit" data-id="${post.id}" class="btn btn-outline"><i data-lucide="pencil" class="h-4 w-4"></i>Edit post</button></div>
        </article>`;
      iconRefresh();
    }

    function route() {
      const hash = location.hash.slice(1);
      if (hash === "new") return renderEditor();
      if (hash.startsWith("edit=")) return renderEditor(hash.slice(5));
      if (hash.startsWith("post=")) return renderPost(hash.slice(5));
      renderList();
    }

    document.addEventListener("click", async e => {
      const button = e.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action, id = button.dataset.id;
      if (action === "new") location.hash = "new";
      if (action === "back") location.hash = "";
      if (action === "view") location.hash = `post=${id}`;
      if (action === "edit") location.hash = `edit=${id}`;
      if (action === "delete" && confirm("Delete this post?")) {
        await ready; await deletePost(id); renderList();
      }
    });

    document.addEventListener("submit", async e => {
      if (e.target.id !== "editorForm") return;
      e.preventDefault();
      const form = new FormData(e.target);
      const old = editingId ? await getPost(editingId) : null;
      await savePost({
        id: editingId || crypto.randomUUID(),
        title: form.get("title").trim(),
        excerpt: form.get("excerpt").trim(),
        body: form.get("body"),
        cover: currentCover,
        updated: Date.now()
      });
      location.hash = "";
    });

    document.querySelector("#themeBtn").addEventListener("click", () => {
      const root = document.documentElement;
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      document.querySelector("#themeBtn").innerHTML =
        `<i data-lucide="${root.dataset.theme === "dark" ? "moon" : "sun"}" class="h-5 w-5"></i>`;
      iconRefresh();
    });

    // Lightweight PWA service worker
    if ("serviceWorker" in navigator) {
      const sw = `
        const CACHE = "inkly-v1";
        self.addEventListener("install", e => self.skipWaiting());
        self.addEventListener("activate", e => self.clients.claim());
        self.addEventListener("fetch", e => {
          e.respondWith(fetch(e.request).catch(() => caches.match(e.request)));
        });
      `;
      const blob = new Blob([sw], { type: "text/javascript" });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
    }

    ready.then(route);
    window.addEventListener("hashchange", route);
  </script>
</body>
</html>
